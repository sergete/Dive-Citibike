volumes:
  mongodb-data:
    driver: local
    name: mongo-data
  mongodb-log:
    driver: local
    name: mongo-log
  letsencrypt: # Volume to store Let's Encrypt certificates

networks:
  mongodb_network:
    driver: bridge
    name: mongo-network
  frontend_network:
    driver: bridge