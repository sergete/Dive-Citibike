services:
  mongodb:
    restart: unless-stopped
    image: mongo:8.0.5-rc2@sha256:a58f160bc96d26b48a88142019cf3d4f8eb733d9c6e8cd8558c0d18a23ba9ccb
    container_name: mongodb
    hostname: mongodb
    volumes:
      - mongodb-data:/data/db/
      - mongodb-log:/var/log/mongodb/
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    networks:
      - mongodb_network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_SERVER: 'mongodb'
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    ports:
      - 9000:8081
    links:
      - mongodb
    networks:
      - mongodb_network
    depends_on:
      - mongodb
  
  tasks:
    restart: unless-stopped
    build:
      context: ./backend/tasks
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: tasks
    working_dir: /app
    volumes:
      - ./backend/tasks:/app
    depends_on:
      - mongodb
    networks:
      - mongodb_network

  backend:
    restart: unless-stopped
    build:
      context: ./backend/app
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env
    volumes:
      - ./backend/app:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8090"
    depends_on:
      - mongodb
    networks:
      - mongodb_network
      - frontend_network
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-frontend.rule=Host(`localhost`)"
      - "traefik.http.services.app-frontend.loadbalancer.server.port=3000" # Nginx default port
    environment:
      VITE_API_URL: http://localhost/api/v1/trips/bikes
    networks:
      - frontend_network
  
  traefik:
    container_name: traefik
    image: traefik:v3.3.5
    command:
      # Base config
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--api.insecure=true"
      - "--api.dashboard=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      # Logging
      - "--log.level=DEBUG" # Optional: Set log level
      - "--accesslog=true" # Enable access logs
      # Let's Encrypt configuration
      #- "--certificatesresolvers.myresolver.acme.email=hello@yourdomain.com"
      #- "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      #- "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      #- "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web" # Use HTTP challenge on port 80

    ports:
      - "80:80"   # HTTP
      # - "443:443" # HTTPS
      - "8080:8080" # Traefik Dashboard (optional, for direct access if API insecure is true)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt # Mount the volume for certificates
    networks:
      - frontend_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M

